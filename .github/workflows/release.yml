# Builds the Linux downloads on GitHub's own Linux machines.
#  - Push a version tag (e.g. v1.0.0) and both .AppImage files are attached to a release on the Releases page.
#  - Or Actions > Linux release > Run workflow for a test build: the .AppImage files are then under that run's "Artifacts".
# Each .AppImage is one file that runs on most 64-bit Linux desktops without installing. First launch needs it marked
# as executable (right-click > Properties > Allow executing as program, or chmod +x) - see README.md.
name: Linux release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - rid: linux-x64
            arch: x86_64
            label: x64     # most PCs and laptops (Intel / AMD)
          - rid: linux-arm64
            arch: aarch64
            label: arm64   # 64-bit ARM, e.g. Raspberry Pi 4 / 5 with 64-bit OS
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        run: >
          dotnet publish LinuxPartsFinder/LinuxPartsFinder.csproj -c Release -r ${{ matrix.rid }}
          --self-contained true -o publish
          -p:Version=${{ steps.version.outputs.version }}

      - name: Make .AppImage
        run: >
          bash build/make-appimage.sh publish ${{ matrix.arch }} ${{ steps.version.outputs.version }}
          LinuxPartsFinder-linux-${{ matrix.label }}.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: LinuxPartsFinder-linux-${{ matrix.label }}
          path: LinuxPartsFinder-linux-${{ matrix.label }}.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: appimages
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          make_latest: true
          files: appimages/*.AppImage
          body: |
            LinuxPartsFinder, the Linux edition of WinPartsFinder.

            **Download** (click to download straight away):
            - [LinuxPartsFinder-linux-x64.AppImage](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/LinuxPartsFinder-linux-x64.AppImage) - most PCs and laptops (Intel / AMD)
            - [LinuxPartsFinder-linux-arm64.AppImage](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/LinuxPartsFinder-linux-arm64.AppImage) - 64-bit ARM, e.g. Raspberry Pi 4 / 5 with a 64-bit OS

            Needs a 64-bit Linux desktop from about 2020 or later.

            Before the first launch, mark the file as executable: right-click it > Properties > Allow executing as program,
            or in a terminal: `chmod +x LinuxPartsFinder-linux-x64.AppImage`. Then double-click it to run.
            More information on my webpage here - https://www.ianjohnston.com/index.php/projects/winpartsfinder
